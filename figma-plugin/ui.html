<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; --ink: #18231d; --muted: #68746d; --line: #d9e3da; --accent: #145a3a; --soft: #e7f3ea; }
      body { margin: 0; padding: 20px; color: var(--ink); font: 13px/1.55 Inter, "Apple SD Gothic Neo", sans-serif; }
      .eyebrow { color: var(--accent); font: 600 10px/1 Inter, sans-serif; letter-spacing: .12em; }
      h1 { margin: 8px 0 5px; font-size: 18px; letter-spacing: -.03em; }
      p { margin: 0; color: var(--muted); }
      .card { margin-top: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
      .label { color: var(--muted); font-size: 11px; }
      .name { margin-top: 2px; font-size: 15px; font-weight: 700; }
      .meta { margin-top: 4px; color: var(--muted); font: 11px/1.5 ui-monospace, SFMono-Regular, monospace; }
      .empty { background: #f4f6f4; }
      .status { margin-top: 13px; min-height: 20px; color: var(--muted); font-size: 11px; }
      .status.ok { color: #167044; }.status.error { color: #b33c29; }
      button { width: 100%; margin-top: 12px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: white; cursor: pointer; font: 600 13px Inter, sans-serif; }
      button:disabled { background: #afbbb3; cursor: default; }
      .results { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
      .result-title { font-size: 14px; font-weight: 700; }.result-meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
      .policy { margin-top: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #f8faf8; }.policy b, .policy span { display: block; }.policy span { margin-top: 3px; color: var(--muted); font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="eyebrow">POLICY IMPACT ASSISTANT</div>
    <h1>선택 프레임 감지</h1>
    <p>Figma에서 프레임을 선택하면 자동으로 감지합니다.</p>
    <div class="card empty" id="selection"><div class="label">선택 대기 중</div><div class="name">프레임을 선택해주세요</div></div>
    <button id="analyze" disabled>선택 프레임 분석</button>
    <div class="status" id="status">프레임을 선택하면 분석할 수 있습니다.</div>
    <div class="results" id="results" hidden></div>
    <script>
      const selectionBox = document.getElementById('selection');
      const status = document.getElementById('status');
      const analyzeButton = document.getElementById('analyze');
      const results = document.getElementById('results');
      const API = 'http://localhost:8787';
      let currentSelection = null;

      function render(selection) {
        if (!selection) {
          selectionBox.className = 'card empty';
          selectionBox.innerHTML = '<div class="label">선택 대기 중</div><div class="name">프레임을 선택해주세요</div>';
          return;
        }
        selectionBox.className = 'card';
        selectionBox.innerHTML = `<div class="label">${selection.nodeType} · ${selection.selectionCount}개 선택</div><div class="name"></div><div class="meta"></div>`;
        selectionBox.querySelector('.name').textContent = selection.nodeName;
        selectionBox.querySelector('.meta').textContent = `node ${selection.nodeId}`;
      }

      async function relay(selection) {
        if (!selection?.nodeId) return;
        try {
          const response = await fetch(`${API}/api/figma-selection`, {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(selection),
          });
          if (!response.ok) throw new Error('server error');
          status.className = 'status ok';
          status.textContent = '선택 상태를 전달했습니다. 파일 키는 Chrome 확장이 현재 URL에서 보완합니다.';
        } catch {
          status.className = 'status error';
          status.textContent = '로컬 서버에 연결하지 못했습니다. 서버 실행 상태를 확인해주세요.';
        }
      }

      function renderResults(data) {
        results.hidden = false;
        results.innerHTML = '';
        const heading = document.createElement('div');
        heading.className = 'result-title';
        heading.textContent = data.screen.screen;
        const meta = document.createElement('div');
        meta.className = 'result-meta';
        meta.textContent = `${data.screen.domain} · 정책 ${data.summary.policies?.length || 0}개`;
        results.append(heading, meta);
        if (data.matched === false) {
          const card = document.createElement('div'); card.className = 'policy';
          const title = document.createElement('b'); title.textContent = '관련 정책 없음';
          const summary = document.createElement('span');
          summary.textContent = data.notice || '정책 문서에서 이 화면과 관련된 내용을 찾지 못했습니다.';
          card.append(title, summary); results.append(card);
          return;
        }
        (data.summary.policies || []).slice(0, 4).forEach((policy) => {
          const card = document.createElement('div'); card.className = 'policy';
          const title = document.createElement('b'); title.textContent = policy.title;
          const summary = document.createElement('span'); summary.textContent = policy.summary;
          card.append(title, summary); results.append(card);
        });
      }

      analyzeButton.addEventListener('click', async () => {
        if (!currentSelection) return;
        analyzeButton.disabled = true;
        status.className = 'status'; status.textContent = '정책을 검색하는 중입니다.';
        try {
          const response = await fetch(`${API}/api/analyze-text`, {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ pageContext: { nodeId: currentSelection.nodeId, nodeName: currentSelection.nodeName, documentTitle: currentSelection.documentName }, textNodes: currentSelection.textNodes }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'analysis error');
          renderResults(data);
          status.className = 'status ok'; status.textContent = '분석을 완료했습니다.';
        } catch (error) {
          status.className = 'status error'; status.textContent = `분석하지 못했습니다: ${error.message}`;
        } finally { analyzeButton.disabled = false; }
      });

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message?.type !== 'selection') return;
        currentSelection = message.selection;
        render(message.selection);
        relay(message.selection);
        analyzeButton.disabled = !message.selection?.textNodes?.length;
        results.hidden = true;
        if (message.selection?.textNodes?.length) status.textContent = `텍스트 ${message.selection.textNodes.length}개를 읽었습니다.`;
      };
    </script>
  </body>
</html>
